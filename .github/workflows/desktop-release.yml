name: AI Cove Turbo Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "turbo-v*"

permissions:
  contents: write

env:
  NODE_VERSION: 22
  DOWNLOAD_BASE_URL: https://ai-cove.com/downloads/turbo

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            os: macos-14
            bundles: app,dmg
          - platform: windows-x86_64
            os: windows-latest
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Build Tauri bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.AI_COVE_TURBO_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.AI_COVE_TURBO_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TURBO_UPDATER_PUBLIC_KEY: ${{ vars.AI_COVE_TURBO_TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TURBO_UPDATER_PUBLIC_KEY"
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('tauri-release-config.json', JSON.stringify({
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: { pubkey: process.env.TURBO_UPDATER_PUBLIC_KEY } }
          }));
          NODE
          npx tauri build --ci --bundles "${{ matrix.bundles }}" --config tauri-release-config.json

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-inputs/${{ matrix.platform }}
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.app.tar.gz' -o \
               -name '*.dmg.sig' -o -name '*.exe.sig' -o -name '*.app.tar.gz.sig' -o \
               -name 'latest.json' \) -exec cp {} release-inputs/${{ matrix.platform }}/ \;
          test -n "$(find release-inputs/${{ matrix.platform }} -type f -print -quit)"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-cove-turbo-${{ matrix.platform }}
          path: release-inputs/${{ matrix.platform }}
          if-no-files-found: error

  assemble:
    name: Assemble and validate release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-inputs
          pattern: ai-cove-turbo-*

      - name: Assemble merged latest.json
        env:
          DOWNLOAD_BASE_URL: ${{ env.DOWNLOAD_BASE_URL }}
        run: node scripts/desktop-release.mjs assemble-ci release-inputs desktop-release

      - name: Upload publish directory
        uses: actions/upload-artifact@v4
        with:
          name: ai-cove-turbo-downloads
          path: desktop-release
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: desktop-release/*
